{% extends "base.html" %}

{% block title %}Home{% endblock %}

{% block content %}
<div class="card" id="sync-config" style="display: none;"></div>

<div class="card" id="upload-section" style="{% if not current_store %}display: none;{% endif %}">
    <h2> UploadFile </h2>
    <form method="POST" action="{{ request.scope.root_path }}/api/v1/uploadFile" enctype="multipart/form-data" id="UploadFile" style="margin-bottom: 1em;">
        <input type="file" id="file" name="file" accept=".csv,application/vnd.ms-excel,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet">
        <button type="submit">UPLOAD</button>
    </form>
</div>

<div class="card" id="files-section" style="{% if not current_store %}display: none;{% endif %}">
    <h2>Uploaded Files</h2>
    <ul id="resources-list">
        <li>Loading...</li>
    </ul>
</div>

<div class="card" id="results" tabindex="-1" style="{% if not current_store %}display: none;{% endif %}">
    <h2>Results &amp; Errors</h2>
    <div class="box response-box" id="check-results">Select a file and run “Select &amp; Check” to see the report here.</div>
</div>

<div class="log-modal" id="file-modal" hidden>
    <div class="log-modal__backdrop" data-close-file-modal></div>
    <div class="log-modal__panel" role="dialog" aria-modal="true" aria-labelledby="file-modal-title">
        <div class="logs-toolbar">
            <h2 id="file-modal-title">File Preview</h2>
        </div>
        <div id="file-modal-notice" class="logs-notice" aria-live="polite"></div>
        <div class="box response-box" id="file-modal-content">Loading...</div>
        <div class="log-modal__footer">
            <button id="file-modal-download" class="view-log-btn">Download</button>
            <button id="file-modal-close" class="delete-all-logs" data-close-file-modal>Close</button>
        </div>
    </div>
</div>

<script>
    // Pass store selection state to JavaScript
    window.storeSelected = {{ 'true' if current_store else 'false' }};
</script>

{% endblock %}
